<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E7DAC0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Korijeni</title>
<meta name="description" content="Korijeni — naše obiteljsko stablo. Svatko može dopuniti svoju granu: nove osobe, datumi i fotografije.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Korijeni">
<meta property="og:title" content="Korijeni — naše obiteljsko stablo">
<meta property="og:description" content="Dodirni, stablo ti stane na ekran kao aplikacija. Dodaj svoju djecu, godine i fotografije — svi to odmah vide.">
<meta property="og:url" content="https://hulkgt.github.io/stablo/">
<meta property="og:image" content="https://hulkgt.github.io/stablo/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="hr_HR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <button class="ic" id="back" aria-label="Natrag" hidden>&#8592;</button>
    <span><b>Korijeni</b><small id="count" hidden>&nbsp;</small></span>
  </div>
  <div class="tools">
    <span id="treetools" class="grp" hidden>
      <button class="ic" id="zout" aria-label="Smanji">&minus;</button>
      <button class="ic" id="zfit" aria-label="Cijelo stablo">⤢</button>
      <button class="ic" id="zin" aria-label="Povećaj">+</button>
    </span>
    <button class="ic" id="help" aria-label="Pomoć">?</button>
  </div>
</header>

<div class="sync" id="sync" hidden></div>

<section class="home" id="home"></section>

<main class="wrap" id="treeview" hidden>
  <div class="stage" id="stage"><svg class="wires" id="wires" aria-hidden="true"></svg></div>
</main>

<div class="sheet" id="sheet" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="wel" id="wel" hidden></div>

<script src="config.js"></script>
<script src="seed.js"></script>
<script src="tree.js"></script>
<script src="home.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script>
</body>
</html>
